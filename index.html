<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毎日日記</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Inter:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="public.css">
</head>
<body>
    <div class="loader" id="loader">
        <div class="loader-text">LOADING<span class="loader-dots"><span>.</span><span>.</span><span>.</span></span></div>
    </div>

    <div class="star-rain" id="starRain" aria-hidden="true"></div>

    <div class="visitor-counter" aria-live="polite">
        <div class="counter-inner">
            <span class="counter-label-left">★ VISITORS ★</span>
            <div class="counter-display" id="counterDisplay">
                <span class="counter-digit">0</span><span class="counter-digit">0</span><span class="counter-digit">0</span><span class="counter-digit">0</span><span class="counter-digit">0</span><span class="counter-digit">0</span>
            </div>
            <span class="counter-label-right">あなたは <strong id="counterNumber">0</strong> 人目の閲覧者です</span>
        </div>
    </div>


    <header class="site-header">
        <div class="decoration-layer" aria-hidden="true">
            <div class="deco-item deco-h1 anim-float"><img src="images/decorations/deco-01-transparent.png" alt="" class="deco-image" onerror="this.parentElement.style.display='none'"></div>
            <div class="deco-item deco-h2 anim-float-slow" style="animation-delay:.4s"><img src="images/decorations/deco-02-transparent.png" alt="" class="deco-image" onerror="this.parentElement.style.display='none'"></div>
            <div class="deco-item deco-h3 anim-rotate" style="animation-delay:.8s"><img src="images/decorations/deco-05-transparent.png" alt="" class="deco-image" onerror="this.parentElement.style.display='none'"></div>
            <div class="deco-item deco-h4 anim-wiggle" style="animation-delay:1.2s"><img src="images/decorations/deco-06-transparent.png" alt="" class="deco-image" onerror="this.parentElement.style.display='none'"></div>
            <div class="deco-item deco-h5 anim-float-slow" style="animation-delay:1.6s"><img src="images/decorations/deco-07-transparent.png" alt="" class="deco-image" onerror="this.parentElement.style.display='none'"></div>
            <div class="deco-item deco-h6 anim-float" style="animation-delay:2.0s"><img src="images/decorations/deco-02-transparent.png" alt="" class="deco-image" onerror="this.parentElement.style.display='none'"></div>
            <div class="deco-item deco-h7 anim-rotate" style="animation-delay:2.4s"><img src="images/decorations/deco-01-transparent.png" alt="" class="deco-image" onerror="this.parentElement.style.display='none'"></div>
            <div class="deco-item deco-h8 anim-wiggle" style="animation-delay:2.8s"><img src="images/decorations/deco-06-transparent.png" alt="" class="deco-image" onerror="this.parentElement.style.display='none'"></div>
        </div>
        <div class="hero">
            <div class="profile-swiper" id="profileSwiper">
                <div class="indicator-bar" id="indicatorBar"></div>
                <div class="card-container">
                    <button class="nav-button nav-prev" id="swiperPrev" aria-label="前の画像">‹</button>
                    <button class="nav-button nav-next" id="swiperNext" aria-label="次の画像">›</button>
                    <div class="profile-card" id="profileCard">
                        <img id="heroPhoto" class="profile-image" alt="プロフィール写真" draggable="false">
                        <div class="like-stamp stamp-like" id="stampLike">NEXT →</div>
                        <div class="like-stamp stamp-nope" id="stampNope">← BACK</div>
                        <div class="card-caption">
                            <span class="caption-number" id="captionNumber">01 / 05</span>
                            <span class="caption-text" id="captionText">PROFILE</span>
                        </div>
                        <div class="swipe-hint" id="swipeHint">← SWIPE →</div>
                    </div>
                </div>
                <div class="dots" id="swiperDots"></div>
            </div>
            <div class="hero-content">
                <div class="hero-title-block">
                    <p class="hero-eyebrow">DAILY JOURNAL / 2026</p>
                    <h2 id="heroName" class="hero-name-jp">石村 穂乃香</h2>
                    <h1 class="hero-title-main">BLOG</h1>
                </div>
                <div class="hero-description-block">
                    <p class="hero-tagline">日々の記録、ひとつずつ。</p>
                    <div class="hero-divider"></div>
                    <p id="heroIntro" class="hero-bio"></p>
                </div>
                <div id="heroSocials" class="hero-socials"></div>
            </div>
        </div>
    </header>

    <div class="content-wrap">
        <div class="decoration-layer decoration-layer-content" aria-hidden="true">
            <div class="deco-item deco-c1 anim-float"><img src="images/decorations/deco-07-transparent.png" alt="" class="deco-image" onerror="this.parentElement.style.display='none'"></div>
            <div class="deco-item deco-c2 anim-wiggle" style="animation-delay:.5s"><img src="images/decorations/deco-05-transparent.png" alt="" class="deco-image" onerror="this.parentElement.style.display='none'"></div>
            <div class="deco-item deco-c3 anim-float-slow" style="animation-delay:1s"><img src="images/decorations/deco-06-transparent.png" alt="" class="deco-image" onerror="this.parentElement.style.display='none'"></div>
            <div class="deco-item deco-c4 anim-rotate" style="animation-delay:1.5s"><img src="images/decorations/deco-01-transparent.png" alt="" class="deco-image" onerror="this.parentElement.style.display='none'"></div>
            <div class="deco-item deco-c5 anim-float" style="animation-delay:2s"><img src="images/decorations/deco-02-transparent.png" alt="" class="deco-image" onerror="this.parentElement.style.display='none'"></div>
            <div class="deco-item deco-c6 anim-wiggle" style="animation-delay:2.5s"><img src="images/decorations/deco-07-transparent.png" alt="" class="deco-image" onerror="this.parentElement.style.display='none'"></div>
        </div>
        <main class="feed-wrap">
            <div class="feed-toolbar">
                <div class="feed-title-block">
                    <span class="feed-title-num">NO. 02</span>
                    <h2 class="feed-title">DIARY ARCHIVE</h2>
                </div>
                <input type="search" id="searchInput" class="feed-search" placeholder="SEARCH...">
            </div>
            <div id="feed" class="feed"></div>
            <div id="emptyState" class="feed-empty" hidden>NO ENTRIES YET</div>
        </main>

        <aside class="widgets-row">
            <section class="side-block">
                <h3 class="side-title">CALENDAR<span class="side-title-en">/ 日付</span></h3>
                <div class="calendar">
                    <div class="calendar-head">
                        <button id="prevMonth" class="cal-nav" aria-label="前の月">‹</button>
                        <div id="calLabel" class="cal-label"></div>
                        <button id="nextMonth" class="cal-nav" aria-label="次の月">›</button>
                    </div>
                    <div class="calendar-grid" id="calGrid"></div>
                </div>
            </section>

            <section class="side-block">
                <h3 class="side-title">POPULAR<span class="side-title-en">/ 人気の日記</span></h3>
                <ul id="popularList" class="popular-list"></ul>
            </section>
        </aside>
    </div>

    <footer class="site-footer">
        <span class="footer-text">★ DAILY JOURNAL / 毎日日記 / EST. 2026 ★</span>
    </footer>

    <div id="readerModal" class="reader-modal" hidden>
        <div class="reader-overlay"></div>
        <article class="reader-card">
            <button class="reader-close" id="readerClose" aria-label="閉じる">×</button>
            <div class="reader-date" id="readerDate"></div>
            <h2 class="reader-title" id="readerTitle" hidden></h2>
            <div class="reader-images" id="readerImages" hidden></div>
            <div class="reader-body" id="readerBody"></div>
            <div class="reader-tags" id="readerTags"></div>
            <div class="reader-actions">
                <button id="readerLike" class="reader-like" aria-pressed="false">
                    <span class="heart">♡</span>
                    <span id="readerLikeCount">0</span>
                </button>
            </div>
        </article>
    </div>

    <script src="public.js"></script>
</body>
</html>
