<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毎日日記</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Inter:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="public.css">
</head>
<body>
    <div class="loader" id="loader">
        <div class="loader-text">LOADING<span class="loader-dots"><span>.</span><span>.</span><span>.</span></span></div>
    </div>

    <div class="deco deco-heart" aria-hidden="true">♥</div>
    <div class="deco deco-bubble" aria-hidden="true"></div>

    <svg class="stamp stamp-chrome-star" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
            <radialGradient id="chromeStarGrad" cx="30%" cy="30%">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="50%" stop-color="#FFB6E1"/>
                <stop offset="100%" stop-color="#9B7BB8"/>
            </radialGradient>
        </defs>
        <path d="M50,5 L61,38 L95,38 L67,58 L78,92 L50,72 L22,92 L33,58 L5,38 L39,38 Z"
              fill="url(#chromeStarGrad)" stroke="#000" stroke-width="3"/>
    </svg>

    <svg class="stamp stamp-cyber-flower" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
            <radialGradient id="cyberFlowerGrad">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="60%" stop-color="#FF6BB5"/>
                <stop offset="100%" stop-color="#C8202A"/>
            </radialGradient>
        </defs>
        <g stroke="#000" stroke-width="2.5">
            <ellipse cx="50" cy="25" rx="15" ry="22" fill="url(#cyberFlowerGrad)"/>
            <ellipse cx="50" cy="75" rx="15" ry="22" fill="url(#cyberFlowerGrad)"/>
            <ellipse cx="25" cy="50" rx="22" ry="15" fill="url(#cyberFlowerGrad)"/>
            <ellipse cx="75" cy="50" rx="22" ry="15" fill="url(#cyberFlowerGrad)"/>
            <circle cx="50" cy="50" r="10" fill="#FFE600"/>
        </g>
    </svg>

    <svg class="stamp stamp-checker-heart" viewBox="0 0 100 90" aria-hidden="true">
        <defs>
            <pattern id="checkerPat" width="8" height="8" patternUnits="userSpaceOnUse">
                <rect width="4" height="4" fill="#C8202A"/>
                <rect x="4" y="4" width="4" height="4" fill="#C8202A"/>
                <rect x="4" width="4" height="4" fill="#FFFFFF"/>
                <rect y="4" width="4" height="4" fill="#FFFFFF"/>
            </pattern>
        </defs>
        <path d="M50,85 C50,85 10,55 10,30 C10,15 22,8 35,8 C42,8 47,13 50,20 C53,13 58,8 65,8 C78,8 90,15 90,30 C90,55 50,85 50,85 Z"
              fill="url(#checkerPat)" stroke="#000" stroke-width="3"/>
    </svg>

    <svg class="stamp stamp-sparkle" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M50,0 Q55,45 100,50 Q55,55 50,100 Q45,55 0,50 Q45,45 50,0 Z"
              fill="#FFFFFF" stroke="#C8202A" stroke-width="3"/>
    </svg>

    <header class="topbar">
        <div class="topbar-left">
            <button class="hamburger" aria-label="menu"><span></span><span></span><span></span></button>
            <a class="topbar-logo" href="/">毎日日記<span class="topbar-logo-en">/ daily journal</span></a>
        </div>
        <nav class="topbar-nav">
            <a class="topbar-nav-link is-active" data-filter="today" href="#">TODAY</a>
            <a class="topbar-nav-link" data-filter="week" href="#">WEEK</a>
            <a class="topbar-nav-link" data-filter="month" href="#">MONTH</a>
            <a class="topbar-nav-link" data-filter="archive" href="#">ARCHIVE</a>
            <a class="topbar-nav-link" data-filter="favorites" href="#">FAVORITES</a>
        </nav>
        <button class="topbar-search-btn" aria-label="search">⚲</button>
    </header>

    <header class="site-header">
        <div class="hero">
            <div class="hero-photo-wrap">
                <img id="heroPhoto" class="hero-photo" alt="プロフィール写真">
                <div class="hero-photo-tag">PROFILE / 001</div>
            </div>
            <div class="hero-content">
                <div class="hero-title-block">
                    <p class="hero-eyebrow">DAILY JOURNAL / 2026</p>
                    <h2 id="heroName" class="hero-name-jp">石村 穂乃香</h2>
                    <h1 class="hero-title-main">BLOG</h1>
                </div>
                <div class="hero-description-block">
                    <p class="hero-tagline">日々の記録、ひとつずつ。</p>
                    <div class="hero-divider"></div>
                    <p id="heroIntro" class="hero-bio"></p>
                </div>
                <div id="heroSocials" class="hero-socials"></div>
            </div>
        </div>
    </header>

    <div class="content-wrap">
        <main class="feed-wrap">
            <div class="feed-toolbar">
                <div class="feed-title-block">
                    <span class="feed-title-num">NO. 02</span>
                    <h2 class="feed-title">DIARY ARCHIVE</h2>
                </div>
                <input type="search" id="searchInput" class="feed-search" placeholder="SEARCH...">
            </div>
            <div id="feed" class="feed"></div>
            <div id="emptyState" class="feed-empty" hidden>NO ENTRIES YET</div>
        </main>

        <aside class="widgets-row">
            <section class="side-block">
                <h3 class="side-title">CALENDAR<span class="side-title-en">/ 日付</span></h3>
                <div class="calendar">
                    <div class="calendar-head">
                        <button id="prevMonth" class="cal-nav" aria-label="前の月">‹</button>
                        <div id="calLabel" class="cal-label"></div>
                        <button id="nextMonth" class="cal-nav" aria-label="次の月">›</button>
                    </div>
                    <div class="calendar-grid" id="calGrid"></div>
                </div>
            </section>

            <section class="side-block">
                <h3 class="side-title">POPULAR<span class="side-title-en">/ 人気の日記</span></h3>
                <ul id="popularList" class="popular-list"></ul>
            </section>
        </aside>
    </div>

    <footer class="site-footer">
        <span class="footer-text">★ DAILY JOURNAL / 毎日日記 / EST. 2026 ★</span>
    </footer>

    <div id="readerModal" class="reader-modal" hidden>
        <div class="reader-overlay"></div>
        <article class="reader-card">
            <button class="reader-close" id="readerClose" aria-label="閉じる">×</button>
            <div class="reader-date" id="readerDate"></div>
            <h2 class="reader-title" id="readerTitle" hidden></h2>
            <div class="reader-images" id="readerImages" hidden></div>
            <div class="reader-body" id="readerBody"></div>
            <div class="reader-tags" id="readerTags"></div>
            <div class="reader-actions">
                <button id="readerLike" class="reader-like" aria-pressed="false">
                    <span class="heart">♡</span>
                    <span id="readerLikeCount">0</span>
                </button>
            </div>
        </article>
    </div>

    <script src="public.js"></script>
</body>
</html>
