<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毎日日記</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Rampart+One&family=RocknRoll+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="public.css">
</head>
<body>
    <header class="site-header">
        <div class="hero">
            <div class="hero-photo-wrap">
                <img id="heroPhoto" class="hero-photo" alt="プロフィール写真">
            </div>
            <h1 id="heroName" class="hero-name">名前未設定</h1>
            <p id="heroIntro" class="hero-intro"></p>
            <div id="heroSocials" class="hero-socials"></div>
        </div>
    </header>

    <div class="content-wrap">
        <aside class="content-side">
            <section class="side-block">
                <h3 class="side-title">日付で見る</h3>
                <div class="calendar">
                    <div class="calendar-head">
                        <button id="prevMonth" class="cal-nav" aria-label="前の月">‹</button>
                        <div id="calLabel" class="cal-label"></div>
                        <button id="nextMonth" class="cal-nav" aria-label="次の月">›</button>
                    </div>
                    <div class="calendar-grid" id="calGrid"></div>
                </div>
            </section>
        </aside>

        <main class="feed-wrap">
            <div class="feed-toolbar">
                <h2 class="feed-title">毎日日記</h2>
                <input type="search" id="searchInput" class="feed-search" placeholder="検索...">
            </div>
            <div id="feed" class="feed"></div>
            <div id="emptyState" class="feed-empty" hidden>まだ公開された日記はありません</div>
        </main>

        <aside class="content-side">
            <section class="side-block">
                <h3 class="side-title">人気の日記</h3>
                <ul id="popularList" class="popular-list"></ul>
            </section>
        </aside>
    </div>

    <footer class="site-footer">
        <span>— 毎日日記 —</span>
    </footer>

    <div id="readerModal" class="reader-modal" hidden>
        <div class="reader-overlay"></div>
        <article class="reader-card">
            <button class="reader-close" id="readerClose" aria-label="閉じる">×</button>
            <div class="reader-date" id="readerDate"></div>
            <h2 class="reader-title" id="readerTitle" hidden></h2>
            <div class="reader-images" id="readerImages" hidden></div>
            <div class="reader-body" id="readerBody"></div>
            <div class="reader-tags" id="readerTags"></div>
            <div class="reader-actions">
                <button id="readerLike" class="reader-like" aria-pressed="false">
                    <span class="heart">♡</span>
                    <span id="readerLikeCount">0</span>
                </button>
            </div>
        </article>
    </div>

    <script src="public.js"></script>
</body>
</html>
